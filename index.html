<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nedumpura layout – 3D site model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#dfe7ea; --ink:#1d2a2e; --muted:#5b6b70; --panel:rgba(250,251,248,.92);
  --line:rgba(29,42,46,.14); --accent:#2f7d5b; --tag:#ffffff; --tagink:#1d2a2e;
  --red:#b3261e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b2326; --ink:#e8eeec; --muted:#9fb0b2; --panel:rgba(28,36,39,.92);
    --line:rgba(232,238,236,.16); --accent:#5fbf8f; --tag:#1f2a2d; --tagink:#e8eeec; --red:#ff8a80;
  }
}
:root[data-theme="dark"]{
  --bg:#1b2326; --ink:#e8eeec; --muted:#9fb0b2; --panel:rgba(28,36,39,.92);
  --line:rgba(232,238,236,.16); --accent:#5fbf8f; --tag:#1f2a2d; --tagink:#e8eeec; --red:#ff8a80;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
canvas{display:block;touch-action:none}
header{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.title{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:min(70vw,360px)}
.title h1{font-family:"Barlow Semi Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:1.15rem;margin:0;letter-spacing:.01em}
.title p{margin:2px 0 0;font-size:.8rem;color:var(--muted)}
.compass{pointer-events:none;width:46px;height:46px;border-radius:50%;background:var(--panel);border:1px solid var(--line);
  display:grid;place-items:center;flex:none}
.compass svg{width:34px;height:34px;transition:none}
.controls{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:5}
.controls button{font:500 .9rem "Barlow",system-ui,sans-serif;color:var(--ink);background:transparent;border:0;border-radius:999px;
  padding:9px 15px;cursor:pointer;min-height:40px;white-space:nowrap}
.controls button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.controls button:focus-visible,.close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;text-align:center;
  background:var(--tag);color:var(--tagink);border-radius:8px;padding:3px 7px 4px;font-size:.72rem;line-height:1.15;
  box-shadow:0 1px 0 var(--line);border:1px solid var(--line)}
.tag b{font-family:"Barlow Semi Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:.8rem;display:block}
.tag span{color:var(--red)}
.tag.sel{outline:2px solid var(--accent)}
.hidden{display:none!important}
.sheet{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);margin:0 auto;max-width:380px;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;z-index:6;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sheet h2{margin:0;font-family:"Barlow Semi Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:1.25rem}
.sheet dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:8px 0 0;font-size:.9rem}
.sheet dt{color:var(--muted)} .sheet dd{margin:0}
.sheet .note{margin:8px 0 0;font-size:.78rem;color:var(--muted)}
.close{position:absolute;top:8px;right:8px;border:0;background:transparent;color:var(--muted);font-size:1.3rem;width:36px;height:36px;border-radius:50%;cursor:pointer}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);text-align:center;font-size:.78rem;color:var(--muted);pointer-events:none}
#err{position:fixed;inset:auto 16px 50% 16px;text-align:center;color:var(--ink)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

  const circ=[];for(let i=0;i<=32;i++){const a=i/32*Math.PI*2;circ.push(new THREE.Vector3(Math.cos(a)*1.5,0.02,Math.sin(a)*1.5));}
  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(circ),white));
  const pm=mat(0xffffff);
  for(const sx of[-1,1]){const goal=new THREE.Group();
    for(const sz of[-1,1]){const p=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,1.6,6),pm);p.position.set(0,0.8,sz*Math.min(1.2,W*0.22));p.castShadow=true;goal.add(p);}
    const bar=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,2*Math.min(1.2,W*0.22),6),pm);bar.rotation.x=Math.PI/2;bar.position.y=1.6;goal.add(bar);
    goal.position.x=sx*L/2;g.add(goal);}
  g.position.set(rec.field.c[0],0.19,rec.field.c[1]); g.rotation.y=-rec.ang; root.add(g);
}
const trunkM=mat(0x8a6f50), frondM=mat(0x4f8a3a,{side:THREE.DoubleSide});
function palm(x,z,h){
  const g=new THREE.Group(); const lean=(rnd()-0.5)*0.25;
  const t=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.26,h,7),trunkM); t.position.y=h/2; t.castShadow=true; g.add(t);
  const top=new THREE.Group(); top.position.y=h;
  for(let i=0;i<8;i++){const f=new THREE.Mesh(new THREE.ConeGeometry(0.5,3.6,4,1,true),frondM);f.geometry.translate(0,1.8,0);f.scale.z=0.25;
    f.rotation.z=Math.PI/2+0.45; const p=new THREE.Group(); p.rotation.y=i/8*Math.PI*2+rnd(); p.add(f); f.castShadow=true; top.add(p);}
  g.add(top); g.rotation.z=lean; g.rotation.x=(rnd()-0.5)*0.2; g.position.set(x,0.15,z); root.add(g);
}
// point-in-polygon
function inside(p,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,zi]=pts[i],[xj,zj]=pts[j];if(((zi>p[1])!=(zj>p[1]))&&(p[0]<(xj-xi)*(p[1]-zi)/(zj-zi)+xi))c=!c;}return c;}
function distSeg(p,a,b){const dx=b[0]-a[0],dz=b[1]-a[1];let t=((p[0]-a[0])*dx+(p[1]-a[1])*dz)/(dx*dx+dz*dz);t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dz);}
function edgeDist(p,pts){let m=1e9;for(let i=0;i<pts.length;i++)m=Math.min(m,distSeg(p,pts[i],pts[(i+1)%pts.length]));return m;}

let pi=0;
SITE.forEach(rec=>{
  if(rec.type==='proad'){slab(rec.pts,0.06,dark?0x4b5054:0x8a8d8c);outline(rec.pts,0.08,0x6c706f,0.6);return;}
  if(rec.type==='road'){slab(rec.pts,0.08,dark?0x51575b:0x7d8283);return;}
  if(rec.type==='drain'){slab(rec.pts,0.06,0x5b8fc4);outline(rec.pts,0.1,0x2e5d8f);return;}
  if(rec.type==='play'){const m=slab(rec.pts,0.18,0x5f9f4c);outline(rec.pts,0.2,0xffffff,0.9);m.userData=rec;pickables.push(m);playground(rec);addTag(rec,2.5);return;}
  if(rec.type==='mosque'){const m=slab(rec.pts,0.15,0xe6e3d6);outline(rec.pts,0.17,0x2f7d5b);m.userData=rec;pickables.push(m);mosque(rec);addTag(rec,16.5);return;}
  const m=slab(rec.pts,0.15,plotColors[pi++%plotColors.length]);
  outline(rec.pts,0.17,0x8a7b5a); m.userData=rec; pickables.push(m);
  // compound wall (low) along plot edges
  const floors=(rec.name.length%3===0)?1:2; rec.floors=floors;
  if(rec.house){house(rec,floors); addTag(rec,floors*3.1+4.2);} else addTag(rec,2.5);
  // two palms per plot, away from house & edges
  let placed=0,tries=0;
  while(placed<2&&tries<400){tries++;
    const x=Math.min(...rec.pts.map(p=>p[0]))+rnd()*(Math.max(...rec.pts.map(p=>p[0]))-Math.min(...rec.pts.map(p=>p[0])));
    const z=Math.min(...rec.pts.map(p=>p[1]))+rnd()*(Math.max(...rec.pts.map(p=>p[1]))-Math.min(...rec.pts.map(p=>p[1])));
    if(!inside([x,z],rec.pts)||edgeDist([x,z],rec.pts)<1.2)continue;
    if(rec.house&&Math.hypot(x-rec.c[0],z-rec.c[1])<Math.max(rec.house.w,rec.house.d)*0.75+2.5)continue;
    palm(x,z,7+rnd()*4);placed++;}
});
// road markings: dashed centre of 5 m road not needed; add a few palms along west road verge
function addTag(rec,h){
  const el=document.createElement('div');el.className='tag';
  el.innerHTML='<b>'+rec.name+'</b><span>'+rec.cent.toFixed(3)+' cent</span>';
  document.getElementById('tags').appendChild(el);
  tags.push({el,rec,pos:new THREE.Vector3(rec.c[0]-cx,h,rec.c[1]-cz)});
}
// views
const SW=maxx-minx, SD=maxz-minz;
function fitDist(){const v=THREE.MathUtils.degToRad(camera.fov)/2, h=Math.atan(Math.tan(v)*camera.aspect);
  return Math.max(SW/2/Math.tan(h), SD/2/Math.tan(v))*1.08;}
const home3d={dir:new THREE.Vector3(-0.42,0.62,0.66).normalize(),tgt:new THREE.Vector3(0,0,4),k:0.92};
const homeTop={dir:new THREE.Vector3(0,1,0.004).normalize(),tgt:new THREE.Vector3(0,0,0),k:1};
let anim=null;
function goTo(v){const s={p:camera.position.clone(),t:controls.target.clone()},e={p:v.dir.clone().multiplyScalar(fitDist()*v.k).add(v.tgt),t:v.tgt.clone()};
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){camera.position.copy(e.p);controls.target.copy(e.t);return;}
  anim={s,e,t0:performance.now()};}
camera.position.copy(home3d.dir).multiplyScalar(fitDist()*home3d.k).add(home3d.tgt); controls.target.copy(home3d.tgt);
const b3d=document.getElementById('b3d'),btop=document.getElementById('btop'),blab=document.getElementById('blab');
b3d.onclick=()=>{goTo(home3d);b3d.setAttribute('aria-pressed','true');btop.setAttribute('aria-pressed','false');};
btop.onclick=()=>{goTo(homeTop);btop.setAttribute('aria-pressed','true');b3d.setAttribute('aria-pressed','false');};
let showTags=true;
blab.onclick=()=>{showTags=!showTags;blab.setAttribute('aria-pressed',String(showTags));document.getElementById('tags').classList.toggle('hidden',!showTags);};
// picking
const ray=new THREE.Raycaster(),mp=new THREE.Vector2(); let down=null, selMesh=null, selColor=null;
renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;
  mp.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(mp,camera);
  const hit=ray.intersectObjects(pickables)[0]; select(hit?hit.object:null);
});
function select(m){
  if(selMesh){selMesh.material.color.setHex(selColor);selMesh=null;}
  tags.forEach(t=>t.el.classList.remove('sel'));
  const sh=document.getElementById('sheet');
  if(!m){sh.classList.add('hidden');return;}
  selMesh=m;selColor=m.material.color.getHex();m.material.color.setHex(0xf2c879);
  const r=m.userData; tags.forEach(t=>{if(t.rec===r)t.el.classList.add('sel');});
  document.getElementById('sName').textContent=r.name;
  const rows=[['Area',r.cent.toFixed(3)+' cent'],['In m²','≈ '+Math.round(r.cent*40.4686)+' m²'],['Survey no.',r.sy]];
  let note='';
  if(r.type==='plot'&&r.vacant){note='Vacant plot. Arshad also owns 16.150 cent in Sy.No 162, across the road.';}
  else if(r.type==='plot'){rows.push(['Model house',(r.floors===2?'2-storey':'1-storey')+', '+r.house.w.toFixed(0)+' × '+r.house.d.toFixed(0)+' m']);note='House is a placeholder for visualising the plot, not a design.';}
  if(r.type==='mosque'){rows.push(['Entrances','Panchayath Road and 5.0 m road']);note='Moved here in the revised plan.';}
  if(r.type==='play'){note='2 cent of the original play ground went to Musthafa in the revised plan.';}
  document.getElementById('sList').innerHTML=rows.map(([a,b])=>'<dt>'+a+'</dt><dd>'+b+'</dd>').join('');
  document.getElementById('sNote').textContent=note; sh.classList.remove('hidden');
  document.getElementById('hint').classList.add('hidden');
}
document.getElementById('close').onclick=()=>select(null);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const needle=document.getElementById('needle'); const v=new THREE.Vector3();
function loop(now){
  requestAnimationFrame(loop);
  if(anim){let t=Math.min(1,(now-anim.t0)/900);const k=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    camera.position.lerpVectors(anim.s.p,anim.e.p,k);controls.target.lerpVectors(anim.s.t,anim.e.t,k);if(t>=1)anim=null;}
  controls.update(); renderer.render(scene,camera);
  needle.style.transform='rotate('+(-controls.getAzimuthalAngle()*180/Math.PI)+'deg)';
  if(showTags){const W=innerWidth,H=innerHeight;
    tags.forEach(t=>{v.copy(t.pos).project(camera);const on=v.z<1&&Math.abs(v.x)<1.1&&Math.abs(v.y)<1.1;
      t.el.style.display=on?'':'none'; if(on){t.el.style.left=((v.x+1)/2*W)+'px';t.el.style.top=((1-v.y)/2*H)+'px';}});}
}
requestAnimationFrame(loop);
})();
</script>
